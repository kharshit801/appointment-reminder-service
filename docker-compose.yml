services:
  db:
    image: postgres:16-alpine
    container_name: appointment-reminder-db
    environment:
      POSTGRES_DB: appointments
      POSTGRES_USER: appointments
      POSTGRES_PASSWORD: appointments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointments -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
